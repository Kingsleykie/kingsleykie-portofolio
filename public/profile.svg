<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="avatarGlowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGradLight)" stroke="#bae6fd" stroke-width="2"/>
  <circle cx="200" cy="170" r="130" fill="url(#avatarGlowLight)"/>

  <!-- Developer Silhouette with Tech Aura -->
  <circle cx="200" cy="150" r="60" fill="url(#accentGradLight)"/>
  <circle cx="200" cy="150" r="54" fill="#ffffff"/>
  <!-- Head Details -->
  <circle cx="200" cy="145" r="38" fill="#0284c7"/>
  <!-- Torso & Shoulders -->
  <path d="M100 330 C100 240, 140 220, 200 220 C260 220, 300 240, 300 330 Z" fill="url(#accentGradLight)" opacity="0.9"/>
  <path d="M115 330 C115 255, 150 235, 200 235 C250 235, 285 255, 285 330 Z" fill="#ffffff"/>

  <!-- Code brackets graphic -->
  <path d="M70 170 L50 190 L70 210" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 170 L350 190 L330 210" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M210 300 L190 350" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

  <!-- Tech Badge on Avatar -->
  <rect x="130" y="340" width="140" height="32" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="200" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Kingsley Kie</text>
</svg>
