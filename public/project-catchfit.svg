<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFitLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="fitGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bgFitLight)" stroke="#99f6e4" stroke-width="2"/>
  
  <circle cx="300" cy="150" r="90" fill="#0d9488" opacity="0.12"/>
  
  <!-- Mobile Device Frame Mockup -->
  <rect x="235" y="60" width="130" height="200" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <line x1="280" y1="75" x2="320" y2="75" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  
  <!-- AI Pulse wave inside screen -->
  <path d="M250 160 L270 160 L280 135 L295 185 L310 145 L320 160 L350 160" fill="none" stroke="url(#fitGradLight)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="310" cy="145" r="4" fill="#0284c7"/>

  <!-- Metric badges inside screen -->
  <rect x="250" y="200" width="45" height="18" rx="4" fill="#ccfbf1"/>
  <rect x="305" y="200" width="45" height="18" rx="4" fill="#ccfbf1"/>

  <!-- Label -->
  <text x="300" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#115e59" text-anchor="middle">CatchFit</text>
  <text x="300" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f766e" text-anchor="middle">AI Health &amp; Fitness Mobile App</text>
</svg>
