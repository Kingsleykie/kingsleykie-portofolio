<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCyberLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="cyberGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bgCyberLight)" stroke="#ddd6fe" stroke-width="2"/>
  
  <!-- Subtle cyber rings -->
  <circle cx="300" cy="160" r="100" fill="#8b5cf6" opacity="0.12"/>
  
  <!-- Shield and Lock Icon -->
  <path d="M300 70 L380 110 V180 C380 230 300 270 300 270 C300 270 220 230 220 180 V110 Z" fill="url(#cyberGradLight)"/>
  <path d="M300 85 L365 120 V175 C365 218 300 252 300 252 C300 252 235 218 235 175 V120 Z" fill="#ffffff"/>
  
  <!-- Lock Core -->
  <rect x="280" y="160" width="40" height="35" rx="6" fill="#6366f1"/>
  <path d="M288 160 v-12 a12 12 0 0 1 24 0 v12" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  <circle cx="300" cy="177" r="4" fill="#ffffff"/>

  <!-- Level/Gamification badge -->
  <rect x="220" y="285" width="160" height="26" rx="13" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="300" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">Gamified Cyber Learning</text>

  <text x="300" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#312e81" text-anchor="middle">CyberLearn</text>
</svg>
