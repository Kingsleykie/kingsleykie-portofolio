<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCoffeeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="warmGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bgCoffeeLight)" stroke="#fde68a" stroke-width="2"/>
  
  <!-- Subtle Amber Rings -->
  <circle cx="300" cy="160" r="110" fill="#f59e0b" opacity="0.12"/>
  <circle cx="300" cy="160" r="80" fill="#f59e0b" opacity="0.18"/>
  
  <!-- Coffee Cup Graphics -->
  <ellipse cx="300" cy="230" rx="70" ry="12" fill="#e2e8f0"/>
  <path d="M250 140 h100 v60 a50 50 0 0 1 -100 0 Z" fill="url(#warmGradLight)"/>
  <path d="M350 150 h24 a16 16 0 0 1 0 32 h-24" fill="none" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Steam lines -->
  <path d="M280 120 Q275 100 285 85" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M300 115 Q305 95 298 80" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M320 120 Q315 100 325 85" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <!-- Code/UI mock badges -->
  <rect x="50" y="40" width="120" height="24" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
  <circle cx="65" cy="52" r="4" fill="#ef4444"/>
  <circle cx="78" cy="52" r="4" fill="#f59e0b"/>
  <circle cx="91" cy="52" r="4" fill="#10b981"/>

  <text x="300" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#78350f" text-anchor="middle">Mr.Coffee</text>
  <text x="300" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#92400e" text-anchor="middle">E-Commerce &amp; Ordering Platform</text>
</svg>
